services:
  backend:
    build:
      context: ./BackEnd
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: urban-gala-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      llm-service:
        condition: service_healthy
      busyness-service:
        condition: service_healthy
    environment:
      BUSYNESS_SERVICE_URL: http://busyness-service:5000
      LLM_SERVICE_URL: http://llm-service:5000
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-urban_gala}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-urbanuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_AVATARS_DIR: /app/avatars
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./BackEnd/avatars:/app/avatars

  db:
    image: mysql:8
    container_name: urban-gala-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urban_gala}
      MYSQL_USER: ${MYSQL_USER:-urbanuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Set local-infile for data loading
    command:
      - --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    volumes:
      - db_data:/var/lib/mysql
      - ./BackEnd/docker/db-config/${MYSQL_CONFIG_FILE:-my.cnf}:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: urban-gala-frontend
    ports:
      - "5173:5173"
      - "24678:24678"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    command: npm run dev
    environment:
      - HOST=0.0.0.0
      - VITE_GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY}
      - VITE_API_BASE_URL=/api
      - VITE_LLM_API_URL=/api/chat
    depends_on:
      - backend
    networks:
      - app-network

  frontend-prod:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_LLM_API_URL: /api/chat
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY}
    container_name: urban-gala-frontend-prod
    profiles: ["prod"]
    ports:
      - "80:80"
    depends_on:
      - backend
      - llm-service
    restart: unless-stopped
    networks:
      - app-network

  llm-service:
    build:
      context: ./BackEnd/llm-service
    container_name: urban-gala-llm
    ports:
      - "5002:5000"
    expose:
      - "5000"
    # Corpus catalog (read-only), precomputed embeddings, and chat logs
    volumes:
      - ./BackEnd/llm-service/corpus:/app/corpus:rw
      - ./BackEnd/llm-service/data:/app/data:ro
      - chat_logs:/app/logs
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=/app/models/mpnet-base-v2
      - EMBEDDING_MODEL_NAME=all-mpnet-base-v2
      # Measured 2026-09-19 over 96 questions: +35 ms p50 for +0.041 Recall@5.
      # See docs/CROSS_ENCODER_TRADEOFF.md.
      - CROSS_ENCODER_ENABLED=true
      - CROSS_ENCODER_MODEL_NAME=/app/models/cross-encoder
      - EMBEDDINGS_PATH=/app/data/location_embeddings.npy
      - HF_TOKEN=${HF_TOKEN}
      # TypeSafe System One / Jev. Disabled by default; regex fallback applies
      # whenever the key is absent or the flag is false.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - JEV_ENABLED=${JEV_ENABLED:-false}
      # Runtime Jev query analysis (gate/location/categories/answerability).
      # Set false to keep only the guardrail ("option 1").
      - JEV_QUERY_ANALYSIS_ENABLED=${JEV_QUERY_ANALYSIS_ENABLED:-false}
      # HF rewrite_query. The branch skips it when a Jev analysis is present;
      # false also skips it on the regex path (option 1).
      - HF_QUERY_REWRITE_ENABLED=${HF_QUERY_REWRITE_ENABLED:-false}
      - JEV_MODEL=${JEV_MODEL:-jev-latest}
      - JEV_TIMEOUT_SECONDS=${JEV_TIMEOUT_SECONDS:-8}
      - JEV_CONFIDENCE_THRESHOLD=${JEV_CONFIDENCE_THRESHOLD:-0.5}
      - JEV_GUARDRAIL_ENABLED=${JEV_GUARDRAIL_ENABLED:-true}
      - JEV_GUARDRAIL_REPLACE_THRESHOLD=${JEV_GUARDRAIL_REPLACE_THRESHOLD:-0.8}
      - JEV_GUARDRAIL_CAVEAT_THRESHOLD=${JEV_GUARDRAIL_CAVEAT_THRESHOLD:-0.5}
      - JEV_ABSTENTION_ENABLED=${JEV_ABSTENTION_ENABLED:-true}
      - JEV_ABSTENTION_THRESHOLD=${JEV_ABSTENTION_THRESHOLD:-0.5}
      # Pre-retrieval out-of-scope / abuse cap (declines before retrieval).
      - CHAT_SCOPE_GATE_ENABLED=${CHAT_SCOPE_GATE_ENABLED:-true}
      - CHAT_SCOPE_OFFTOPIC_THRESHOLD=${CHAT_SCOPE_OFFTOPIC_THRESHOLD:-0.4}
      - CHAT_SCOPE_HARMFUL_THRESHOLD=${CHAT_SCOPE_HARMFUL_THRESHOLD:-0.5}
      # Jev re-ranking replaces the CPU cross-encoder (kept off by default).
      - JEV_RERANK_ENABLED=${JEV_RERANK_ENABLED:-false}
      - JEV_RERANK_OVERFETCH_MULTIPLIER=${JEV_RERANK_OVERFETCH_MULTIPLIER:-5}
      - JEV_RERANK_MAX_CANDIDATES=${JEV_RERANK_MAX_CANDIDATES:-50}
      - JEV_SEARCH_COMPOSE_ENABLED=${JEV_SEARCH_COMPOSE_ENABLED:-false}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY}
      - FLASK_CORS_ALLOWED_ORIGINS=${FLASK_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - CORPUS_VERSION=v1
      - DATA_PATH=/app/corpus/v1/venues.csv
      - MANIFEST_PATH=/app/corpus/v1/manifest.json
      - PYTHONUNBUFFERED=1
      - BUSYNESS_SERVICE_URL=http://busyness-service:5000
      # Cold busyness compute is ~6 s; keep this above that or chat reports
      # "unavailable" until the service cache warms.
      - BUSYNESS_FETCH_TIMEOUT_SECONDS=${BUSYNESS_FETCH_TIMEOUT_SECONDS:-15}
      - CHAT_LOG_PATH=/app/logs/chat-requests.jsonl
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    networks:
      - app-network
    # Gunicorn is configured via gunicorn.conf.py (Dockerfile CMD)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s  # Give more time for model loading
    deploy:
      resources:
        limits:
          memory: 3G  # Increased from 2G for sentence transformers
          cpus: '4.0'  # Shared budget for retrieval, chat, and concurrent workers
        reservations:
          memory: 2G  # Guaranteed memory for model loading
          cpus: '2.0'  # Guaranteed CPU for responsiveness
    restart: unless-stopped

  busyness-service:
    build:
      context: ./BackEnd/busyness-service
    container_name: urban-gala-busyness
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/DNNs
      - LSTM_MODEL_PATH=/app/models/LSTMs/Fin.keras
      - MODEL_CHECKSUMS_PATH=/app/models/checksums.sha256
      - BUSYNESS_LIVE_CACHE_TTL_SECONDS=${BUSYNESS_LIVE_CACHE_TTL_SECONDS:-1800}
      - BUSYNESS_FORECAST_CACHE_TTL_SECONDS=${BUSYNESS_FORECAST_CACHE_TTL_SECONDS:-1800}
      - BUSYNESS_CACHE_MAX_ENTRIES=${BUSYNESS_CACHE_MAX_ENTRIES:-512}
      # Keep the ~6 s cold compute out of the request path.
      - BUSYNESS_WARM_REFRESH_SECONDS=${BUSYNESS_WARM_REFRESH_SECONDS:-900}
      - BUSYNESS_WARMUP_ENABLED=${BUSYNESS_WARMUP_ENABLED:-true}
      - FLASK_CORS_ALLOWED_ORIGINS=${FLASK_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    networks:
      - app-network
    healthcheck:
      # Tighter healthcheck to get faster feedback on the crash-loop.
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s # Give 15s to start. If it fails after this, we know it's crashing.
    deploy:
      resources:
        limits:
          memory: 3G  # Increased from 2G for TensorFlow models
          cpus: '2.5'  # Increased from 2.0 for parallel inference
        reservations:
          memory: 2G  # Guaranteed memory for model loading
          cpus: '1.0'  # Guaranteed CPU for responsiveness
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: urban-gala-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: urban-gala-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  db_data:
  chat_logs:
  prometheus_data:
  grafana_data:
