# Prometheus configuration — scrapes the llm-service metrics endpoint
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "llm-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["llm-service:5000"]
    scrape_interval: 15s
    scrape_timeout: 10s
