# Option-1 prototype sidecar: keep the Jev faithfulness guardrail, drop the
# runtime query-analysis and abstention calls, and skip the HF rewrite_query on
# the regex path. Reuses the image built from the main checkout (so rebuild
# llm-service first: `docker compose build llm-service`).
#
#   docker compose -p urban-gala-opt1 -f docker-compose.option1-sidecar.yml up -d
#   curl -sf http://localhost:5003/health
#   docker compose -p urban-gala-opt1 -f docker-compose.option1-sidecar.yml down
#
# Host compare ports: jev :5002, v2 :5001, option1 :5003.

services:
  llm-service-opt1:
    image: team-2-comp47360-llm-service:latest
    container_name: urban-gala-llm-opt1
    ports:
      - "5003:5000"
    volumes:
      - ./BackEnd/llm-service/corpus:/app/corpus:rw
      - ./BackEnd/llm-service/data:/app/data:ro
      - chat_logs_opt1:/app/logs
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=/app/models/mpnet-base-v2
      - EMBEDDING_MODEL_NAME=all-mpnet-base-v2
      - CROSS_ENCODER_ENABLED=true
      - CROSS_ENCODER_MODEL_NAME=/app/models/cross-encoder
      - EMBEDDINGS_PATH=/app/data/location_embeddings.npy
      - HF_TOKEN=${HF_TOKEN}
      # Jev: scope cap + abstention + guardrail (no runtime query analysis).
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - JEV_ENABLED=true
      - JEV_QUERY_ANALYSIS_ENABLED=false
      - JEV_ABSTENTION_ENABLED=true
      - JEV_GUARDRAIL_ENABLED=true
      - JEV_SEARCH_COMPOSE_ENABLED=false
      - JEV_TIMEOUT_SECONDS=${JEV_TIMEOUT_SECONDS:-8}
      # Pre-retrieval out-of-scope / abuse cap.
      - CHAT_SCOPE_GATE_ENABLED=true
      - CHAT_SCOPE_OFFTOPIC_THRESHOLD=${CHAT_SCOPE_OFFTOPIC_THRESHOLD:-0.4}
      - CHAT_SCOPE_HARMFUL_THRESHOLD=${CHAT_SCOPE_HARMFUL_THRESHOLD:-0.5}
      # Skip the HF rewrite on the regex path too (the branch's measured win).
      - HF_QUERY_REWRITE_ENABLED=false
      - BUSYNESS_SERVICE_URL=http://busyness-service:5000
      - BUSYNESS_FETCH_TIMEOUT_SECONDS=15
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY}
      - FLASK_CORS_ALLOWED_ORIGINS=${FLASK_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - CORPUS_VERSION=v1
      - DATA_PATH=/app/corpus/v1/venues.csv
      - MANIFEST_PATH=/app/corpus/v1/manifest.json
      - CHAT_LOG_PATH=/app/logs/chat-requests.jsonl
      - PYTHONUNBUFFERED=1
      - TOKENIZERS_PARALLELISM=false
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    command: ["gunicorn", "-c", "gunicorn.conf.py", "--workers", "1", "app:app"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    # Match the main llm-service (4 CPUs / 3 GiB) so the cross-encoder is not
    # artificially throttled relative to jev; the sidecar's own 2-CPU cap made
    # retrieval look ~2x slower than it is.
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: team-2-comp47360_app-network

volumes:
  chat_logs_opt1:
