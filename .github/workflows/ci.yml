name: CI

on:
  push:
    branches: [main, urban-gala-v2]
  pull_request:
    branches: [main, urban-gala-v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-tests:
    name: Java 17 Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw test --batch-mode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: BackEnd/target/surefire-reports/

  python-tests:
    name: Python 3.11 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [llm-service, busyness-service]
    defaults:
      run:
        working-directory: BackEnd/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov

      - name: Run pytest
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: python -m pytest tests/ -q

  frontend-tests:
    name: Frontend Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

      - name: Production build
        run: npm run build

  artifact-verify:
    name: Artifact Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify ML artifacts
        run: bash scripts/verify-artifacts.sh

  ragas-smoke:
    name: RAGAS Evaluation Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BackEnd/llm-service
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAGAS smoke test (mock judge)
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONPATH: .
        run: python3 scripts/eval_ragas.py --limit 10 --mock-judge --no-delay --metrics-only

      - name: Upload mock eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-smoke-report
          path: BackEnd/llm-service/reports/

  ablation:
    name: Cross-Encoder Ablation (Informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: BackEnd/llm-service
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cross-encoder ablation (10 questions)
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONPATH: .
        run: python3 scripts/ablate_cross_encoder.py --limit 10 --metrics-only --report reports/ablation.json

      - name: Upload ablation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablation-report
          path: BackEnd/llm-service/reports/ablation.json

  eval-report:
    name: Evaluation Report (Gated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BackEnd/llm-service
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retrieval evaluation (baseline + improved)
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONPATH: .
        run: |
          python3 scripts/run_eval.py \
            --threshold-recall 0.25 \
            --metrics-only \
            --baseline \
            --report reports/ci-eval.json

      - name: Verify recall threshold
        run: |
          python3 -c "
          import json
          with open('reports/ci-eval.json') as f:
              report = json.load(f)
          recall = report['aggregate_recall']
          print(f'Aggregate Recall@5: {recall}')
          assert recall >= 0.25, f'Recall@5 {recall} is below threshold 0.25'
          print('Recall threshold met.')
          "

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: BackEnd/llm-service/reports/ci-eval.json
