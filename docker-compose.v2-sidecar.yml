# Second llm-service from the urban-gala-v2 worktree.
# Shares the running jev stack's network, busyness-service, and .env secrets.
# Does not start MySQL, Spring, frontend, or a second busyness process.
#
#   git worktree add ../team-2-COMP47360-v2 urban-gala-v2
#   docker compose -p urban-gala-v2 -f docker-compose.v2-sidecar.yml up -d --build
#
# Host compare ports: jev :5002 (main compose; macOS uses :5000) and v2 :5001.
#
# Configured as the merged option-1 runtime (scope cap + abstention + guardrail,
# cross-encoder on, Jev query analysis off, HF rewrite off) so v2 can be tested
# at the same settings as the deployed jev service.

services:
  llm-service-v2:
    build:
      context: ../team-2-COMP47360-v2/BackEnd/llm-service
    container_name: urban-gala-llm-v2
    ports:
      - "5001:5000"
    volumes:
      - ../team-2-COMP47360-v2/BackEnd/llm-service/corpus:/app/corpus:rw
      - ../team-2-COMP47360-v2/BackEnd/llm-service/data:/app/data:ro
      - chat_logs_v2:/app/logs
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=/app/models/mpnet-base-v2
      - EMBEDDING_MODEL_NAME=all-mpnet-base-v2
      - CROSS_ENCODER_ENABLED=true
      - CROSS_ENCODER_MODEL_NAME=/app/models/cross-encoder
      - EMBEDDINGS_PATH=/app/data/location_embeddings.npy
      - HF_TOKEN=${HF_TOKEN}
      # Jev option 1: scope cap + abstention + guardrail; no query analysis.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - JEV_ENABLED=true
      - JEV_QUERY_ANALYSIS_ENABLED=false
      - HF_QUERY_REWRITE_ENABLED=false
      - JEV_ABSTENTION_ENABLED=true
      - JEV_GUARDRAIL_ENABLED=true
      - CHAT_SCOPE_GATE_ENABLED=true
      - CHAT_SCOPE_OFFTOPIC_THRESHOLD=${CHAT_SCOPE_OFFTOPIC_THRESHOLD:-0.4}
      - CHAT_SCOPE_HARMFUL_THRESHOLD=${CHAT_SCOPE_HARMFUL_THRESHOLD:-0.5}
      - BUSYNESS_FETCH_TIMEOUT_SECONDS=15
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY}
      - FLASK_CORS_ALLOWED_ORIGINS=${FLASK_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - CORPUS_VERSION=v1
      - DATA_PATH=/app/corpus/v1/venues.csv
      - MANIFEST_PATH=/app/corpus/v1/manifest.json
      - PYTHONUNBUFFERED=1
      - BUSYNESS_SERVICE_URL=http://busyness-service:5000
      - CHAT_LOG_PATH=/app/logs/chat-requests.jsonl
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - TOKENIZERS_PARALLELISM=false
    command: ["gunicorn", "-c", "gunicorn.conf.py", "--workers", "1", "app:app"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: team-2-comp47360_app-network

volumes:
  chat_logs_v2:
